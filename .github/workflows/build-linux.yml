name: Build Linux portable testing release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tk and audio smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb libasound2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source
        run: python -m compileall -q . -x '(^|/)(build|dist|release|\.venv[^/]*)/'

      - name: Build and package Linux release
        run: python build.py

      - name: Smoke-test frozen executable
        run: |
          timeout 12s xvfb-run -a dist/VoidCompass || test $? -eq 124
          test -f release/VoidCompass-v*-Linux-x64.tar.gz
          test -f release/VoidCompass-v*-Linux-x64.tar.gz.sha256

      - name: Upload portable release
        uses: actions/upload-artifact@v6
        with:
          name: VoidCompass-Linux-x64
          path: |
            release/VoidCompass-v*-Linux-x64.tar.gz
            release/VoidCompass-v*-Linux-x64.tar.gz.sha256
          if-no-files-found: error
