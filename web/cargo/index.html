<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Cargo Manifest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="cargo" class="cargo empty">
    <div class="edge edge-top"></div><div class="edge edge-bottom"></div>
    <header>
      <div class="title-lock"><i></i><strong>CARGO</strong></div>
      <b id="hold-state">HOLD EMPTY</b>
    </header>

    <section class="hold-summary">
      <div class="hold-glyph" aria-hidden="true">
        <i></i><i></i><b></b><em id="hold-percent">—</em>
      </div>
      <div class="hold-total"><small>CARGO HOLD</small><strong id="hold-total">0 T</strong><span id="hold-detail">CAPACITY UNKNOWN</span></div>
      <div class="hold-free"><small>AVAILABLE</small><strong id="hold-free">—</strong><span>TONNES FREE</span></div>
    </section>

    <section class="capacity">
      <div class="capacity-track"><div id="capacity-segments" class="capacity-segments"></div><i class="capacity-flow"></i></div>
      <div class="capacity-label"><span id="capacity-percent">CAPACITY UNKNOWN</span><b id="stack-count">0 STACKS</b></div>
    </section>

    <section id="cargo-flags" class="cargo-flags"></section>
    <div class="manifest-head"><span>COMMODITY</span><b>HOLD ALLOCATION</b></div>
    <section id="manifest" class="manifest"></section>
    <footer><b id="manifest-summary">HOLD EMPTY</b></footer>
    <div class="scanlines"></div><div class="vignette"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
