<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Deep Space Contacts</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <!-- Deep Space Contacts (5.5.2.3): the system's non-body signals, from the
       journal alone, in the Navigation HUD's language. -->
  <main id="scope" class="scope empty">
    <div class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="scanlines"></div><div class="vignette"></div>
    <div id="content" class="content">
      <header class="notice">
        <span id="scope-tag" class="notice-tag">FSS</span>
        <strong id="system-name">SYSTEM</strong>
        <span id="scope-count" class="notice-aside"></span>
      </header>
      <section id="resolution" class="resolution">
        <div class="resolution-line"><span id="resolution-text"></span><b id="resolution-aside"></b></div>
        <div class="resolution-bar"><i id="resolution-fill"></i></div>
      </section>
      <div id="groups" class="groups"></div>
      <section id="rows" class="rows"></section>
      <div id="more" class="more" hidden></div>
      <section id="carriers" class="carriers" hidden>
        <div class="carriers-head"><i class="mark kind-carrier"></i><span id="carriers-count"></span></div>
        <div id="carriers-names" class="carriers-names"></div>
      </section>
    </div>
  </main>
  <script src="/assets/frame-cap.js"></script>
  <script src="/assets/overlay-layout.js"></script>
  <script src="/assets/overlay-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
