<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Deep Space Contacts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="scope" class="scope empty">
    <div class="edge top"></div><div class="edge bottom"></div>
    <header><div class="title"><i></i><strong>DEEP SPACE CONTACTS</strong></div><b id="counter">0 / 0</b></header>
    <section class="system"><span id="system-name">SYSTEM</span><span id="scope-state">FSS CONTACT SCOPE</span></section>
    <div class="progress"><i id="progress-fill"></i><b id="progress-pulse"></b></div>
    <section id="contacts" class="contacts"></section>
    <footer><b id="footer-state">AWAITING CONTACTS</b></footer>
    <div class="scanlines"></div><div class="vignette"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
