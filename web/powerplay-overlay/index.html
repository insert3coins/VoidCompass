<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Powerplay Operations</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <main id="panel" class="panel">
    <header><div><i></i><strong>POWERPLAY OPERATIONS</strong></div><b id="rank">RANK —</b></header>
    <section class="identity"><small>ACTIVE PLEDGE</small><strong id="power">NO ACTIVE PLEDGE</strong><span id="merits">MERITS —</span></section>
    <section class="cycle">
      <div><small>CYCLE GAIN</small><b id="cycle-merits">0</b></div>
      <div><small>COLLECTED</small><b id="collected">0 T</b></div>
      <div><small>DELIVERED</small><b id="delivered">0 T</b></div>
    </section>
    <section class="location"><small id="system">SYSTEM UNKNOWN</small><strong id="system-state">NO POWERPLAY STATE</strong><span id="controller">CONTROL UNKNOWN</span></section>
    <section id="objective" class="objective"><div><small>ACTIVE ASSIGNMENT</small><strong id="objective-title">NO ASSIGNMENT SELECTED</strong><span id="objective-detail">CREATE ONE IN POWERPLAY OPERATIONS</span></div><b id="objective-progress">—</b></section>
    <footer><span>JOURNAL + COMMANDER PLAN</span><b id="cycle-end">CYCLE TIMER —</b></footer>
    <div class="scanlines"></div><div class="vignette"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
