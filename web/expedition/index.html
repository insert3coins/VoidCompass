<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Expedition</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <!-- Expedition (5.6.1): the trip at a glance, in the Navigation HUD's
       language. The HUD's EXPEDITION page shows the same model. Reworked in
       5.6.5 around the next stop: which planet, and how to get onto it. -->
  <main id="expedition" class="expedition empty">
    <div class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="scanlines"></div><div class="vignette"></div>
    <div id="content" class="content">
      <header class="notice">
        <span class="notice-tag">EXPEDITION</span>
        <strong id="name">EXPEDITION</strong>
        <b id="share" class="notice-aside"></b>
      </header>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <p id="distance" class="distance"></p>
      <!-- 5.6.5: the next stop, step by step: jump, fly to the body, land, arrive. -->
      <ol id="steps" class="steps"></ol>
      <section class="target">
        <canvas id="planet" class="planet" width="128" height="128" aria-hidden="true"></canvas>
        <div class="target-words">
          <small id="target-step">NEXT STOP</small>
          <strong id="target-name"></strong>
          <span id="target-sub"></span>
        </div>
      </section>
      <div id="facts" class="facts" hidden></div>
      <div id="strip" class="strip" hidden><canvas id="strip-canvas" class="strip-canvas" aria-hidden="true"></canvas></div>
      <section id="compass" class="compass" hidden>
        <span id="needle" class="needle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 19 21 12 16.5 5 21Z"/></svg></span>
        <div><b id="target-distance"></b><span id="target-detail"></span></div>
      </section>
      <p id="hint" class="hint" hidden></p>
      <p id="detour" class="detour" hidden></p>
      <footer id="figures" class="figures"></footer>
      <div id="warnings" class="warnings"></div>
    </div>
  </main>
  <script src="/assets/frame-cap.js"></script>
  <script src="/assets/overlay-layout.js"></script>
  <script src="/assets/overlay-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
