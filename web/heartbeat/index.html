<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoidCompass Journal Heartbeat</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <main id="heartbeat" class="heartbeat" aria-label="Telemetry heartbeat" title="Telemetry heartbeat">
    <div class="instrument" aria-hidden="true">
      <div class="faceplate"></div>
      <div class="corner corner-nw"></div><div class="corner corner-ne"></div>
      <div class="corner corner-sw"></div><div class="corner corner-se"></div>
      <div class="top-channel"><i></i></div>
      <div class="bottom-channel"><i></i></div>
      <div class="rail rail-left"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="rail rail-right"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="sweep-window"><i></i></div>
      <div class="signal-pulse">
        <div class="signal-core">
          <div class="eye-reticle reticle-top"></div>
          <div class="eye-reticle reticle-bottom"></div>
          <div class="eye-lids">
            <div class="eye-aperture">
              <div class="eye-socket"></div>
              <div class="eye-gaze">
                <div class="eye-drift">
                  <div class="eye-iris"><i></i><b></b></div>
                </div>
              </div>
              <div class="eye-glass"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="event-wave wave-first"></div><div class="event-wave wave-second"></div>
      <div class="event-rays"></div>
      <div class="scanlines"></div>
    </div>
  </main>
  <script src="/assets/overlay-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
