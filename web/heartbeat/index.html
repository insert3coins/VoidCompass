<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Compass Journal Heartbeat</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main id="heartbeat" class="heartbeat" aria-label="Telemetry heartbeat" title="Telemetry heartbeat">
    <section class="pulse-cell"><i class="orbit orbit-a"></i><i class="orbit orbit-b"></i><b class="core"></b><em class="pulse"></em></section>
    <section class="telemetry-copy"><small id="heartbeat-kind">STATUS LINK</small><strong id="heartbeat-state">STARTUP</strong><span id="heartbeat-activity">LINK READY</span></section>
    <svg class="heartbeat-wave" viewBox="0 0 52 18" aria-hidden="true"><polyline points="0,9 8,9 12,3 16,15 21,6 25,9 34,9 38,4 42,13 46,9 52,9"></polyline></svg>
    <i class="edge edge-top"></i><i class="edge edge-bottom"></i>
  </main>
  <script src="app.js"></script>
</body>
</html>
