<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Prospector Analysis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="prospector" class="prospector">
    <div class="edge edge-top"></div><div class="edge edge-bottom"></div>
    <header><div class="title-lock"><i></i><strong>PROSPECTOR ANALYSIS</strong></div><b id="content-badge">UNKNOWN CONTENT</b></header>
    <section class="asteroid">
      <div id="rock-glyph" class="rock-glyph" aria-hidden="true"><i></i><i></i><b></b></div>
      <div class="rock-copy"><small>ASTEROID PROFILE</small><strong id="mining-type">Asteroid</strong><span id="remaining-text">REMAINING UNKNOWN</span></div>
      <div class="remaining"><strong id="remaining-value">—</strong><small>REMAINING</small></div>
    </section>
    <section id="core" class="core" hidden><i>◆</i><div><small>MOTHERLODE DETECTED</small><strong id="core-material">UNKNOWN</strong></div></section>
    <section id="directive" class="directive assess">
      <i></i><div><small>RUN DIRECTIVE</small><strong id="directive-label">ASSESS</strong><span id="directive-detail">No target mineral selected</span></div>
    </section>
    <section class="composition"><div class="section-head"><span>MATERIAL COMPOSITION</span><b id="material-count">0 SIGNALS</b></div><div id="materials" class="materials"></div></section>
    <section class="refinery"><div class="section-head"><span>REFINERY LOG</span><b id="refined-total">AWAITING EVENTS</b></div><div id="refined" class="refined-list"></div></section>
    <footer><b id="analysis-state">PROSPECTOR LOCK</b></footer>
    <div class="scanlines"></div><div class="vignette"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
