<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Hatchling</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <!-- Hatchling (5.6.3): the Games page's pocket pet, while you fly. -->
  <main id="hatchling" class="hatchling empty">
    <div class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="scanlines"></div><div class="vignette"></div>
    <canvas id="roam" class="roam" aria-hidden="true"></canvas>
    <div id="content" class="content">
      <canvas id="pet" class="pet" width="226" height="74" aria-hidden="true"></canvas>
      <div class="pet-words">
        <strong id="name"></strong>
        <b id="mood"></b>
        <small id="title"></small>
        <span id="wants" class="wants" hidden></span>
      </div>
      <div id="needs" class="needs"></div>
      <p id="line" class="line" hidden></p>
    </div>
  </main>
  <script src="/assets/frame-cap.js"></script>
  <script src="/assets/overlay-layout.js"></script>
  <script src="/assets/overlay-client.js"></script>
  <script src="/assets/hatchling-art.js"></script>
  <script src="/assets/hatchling-life.js"></script>
  <script src="app.js"></script>
</body>
</html>
