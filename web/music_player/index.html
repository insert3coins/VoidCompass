<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoidCompass Music Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <main id="player" class="player card idle" aria-label="Now playing">
    <figure class="cover"><img id="cover" alt="" hidden><span aria-hidden="true">♪</span></figure>
    <div class="info">
      <p class="kicker"><i class="lamp" aria-hidden="true"></i><span id="state">STANDBY</span><b id="playlist"></b><em id="modes"></em></p>
      <div class="title-window"><h1 id="title">Nothing playing</h1></div>
      <p id="artist" class="artist"></p>
      <p id="details" class="details"></p>
    </div>
    <canvas id="visualizer" class="visualizer" aria-hidden="true"></canvas>
    <div class="progress" aria-hidden="true"><span id="elapsed">0:00</span><div class="rail"><i id="fill"></i><b id="head"></b></div><span id="total">0:00</span></div>
    <p id="next" class="next" hidden><span>NEXT</span><b id="next-title"></b></p>
  </main>
  <script src="/assets/frame-cap.js"></script>
  <script src="/assets/overlay-layout.js"></script>
  <script src="/assets/overlay-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
