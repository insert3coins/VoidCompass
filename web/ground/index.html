<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Compass Planet Waypoint Navigation</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/assets/cursor.css">
</head>
<body>
  <main id="ground" class="ground" data-state="pending" aria-label="Planet waypoint navigation">
    <div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <header class="masthead">
      <span class="title"><i aria-hidden="true"></i>SURFACE NAV</span>
      <span id="mode" class="mode">SHIP</span>
      <strong id="body-name"></strong>
    </header>

    <div class="target-line">
      <strong id="target-label">TARGET FIX</strong>
      <span id="state-label" class="state-chip" role="status">FIX PENDING</span>
    </div>

    <section id="tape" class="tape" aria-label="Heading tape">
      <div id="tape-strip" class="tape-strip" aria-hidden="true"></div>
      <span class="tape-caret" aria-hidden="true"></span>
      <b id="heading" class="tape-heading">---°</b>
      <span id="tape-target" class="tape-target" aria-hidden="true"></span>
      <span id="tape-edge" class="tape-edge" aria-hidden="true"></span>
    </section>

    <section class="guidance" aria-label="Live waypoint guidance">
      <div class="scope" aria-hidden="true">
        <i class="scope-ring"></i><i class="scope-cross"></i>
        <span id="scope-bearing" class="scope-bearing"><b></b></span>
        <i class="scope-core"></i>
      </div>
      <div class="range">
        <span class="label">DISTANCE</span>
        <strong id="distance">—</strong>
        <span id="closing" class="closing"></span>
      </div>
      <div class="turn">
        <span class="label">COURSE</span>
        <strong id="turn-value">—</strong>
      </div>
    </section>

    <section class="approach" aria-label="Approach">
      <div class="approach-bar" aria-hidden="true">
        <i class="approach-near"></i><i class="approach-zone"></i>
        <i id="approach-fill" class="approach-fill"></i>
        <b id="approach-marker" class="approach-marker"></b>
      </div>
      <div class="approach-scale" aria-hidden="true">
        <span style="left:0">10 KM</span><span style="left:33.33%">1 KM</span>
        <span style="left:66.67%">100 M</span><span class="zone-label" style="left:86.73%">25 M</span>
      </div>
    </section>

    <footer class="fixes">
      <span><small>TGT</small> <b id="target">—</b></span>
      <span><small>HERE</small> <b id="coordinates">POSITION PENDING</b></span>
      <span id="aux" class="aux"></span>
    </footer>
    <div class="scanlines" aria-hidden="true"></div>
  </main>
  <script src="/assets/overlay-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
