const $ = id => document.getElementById(id);
const canvas = document.querySelector("canvas"), ctx = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const layer = spec.layers.blink;
let frames = [], eyeFrames = [], clip, index = 0, loadNumber = 0;
let playing = false, start = 0, timer = 0, blinkStart = null, nextBlink = Infinity, lastEye = -1;

const groups = {"On watch":["idle","idle-settled","blink"],"On duty":["listening","working","charging","alert"],"Conversation":["speaking","speaking-blink","mouth-levels"],"Expressions":["warm-smile","curious","thinking","delighted","reassuring","surprised","downcast","wary"],"Look and sign off":["glance-left","glance-right","goodnight"],"Head gestures":["nod","head-shake"]};
const notes = {"idle":"She keeps watch, refocuses and blinks. The outer locks drift gently between movements.","idle-settled":"Slower breathing and a small head tilt carry through the double blink.","blink":"A single blink, with a quick close and a softer release.","listening":"Nova turns toward the sound and inclines her head. The longer locks swing, then settle as she acknowledges you.","working":"Reads left to right in three fixations, drops her gaze, then nods to confirm.","charging":"As her eyelids ease down, cool reflections move along the polished hair and the cyan temple rings brighten.","alert":"Looks up, checks both sides in quick succession, then faces forward.","speaking":"Two short phrases with closed consonants, open vowels, and a rounded “oh”. Use Blink now to test an independent blink.","speaking-blink":"The same phrases with a blink already drawn into the second one.","mouth-levels":"Drag the slider to audition nine voice levels and a soft reflection on the hair. Blink now works at every level.","warm-smile":"One corner of the mouth lifts first. The cheeks follow as her head tips toward you.","curious":"Her eyes catch something high to one side. The brow rises before the head follows.","thinking":"Looks up and away, knits one brow, then refocuses.","delighted":"Her smile reaches her eyes before her mouth opens into a short laugh. She looks back at you as the smile fades.","reassuring":"She holds eye contact, smiles gently and gives one quiet nod.","surprised":"Her eyes widen first. The jaw parts a beat later as she catches her breath.","downcast":"She takes in the news, lowers her gaze, then lets her chin follow. Her lips settle and her inner brows lift.","wary":"Both eyes check the same signal to screen-right. The brow tightens a beat later before she looks back.","glance-left":"Looks toward screen-left. The head follows, holds the look, then returns.","glance-right":"Looks toward screen-right. The head follows, holds the look, then returns.","goodnight":"A last lift of the chin, then a slow bow. Her eyes close and the cyan temple lights dim.","nod":"A small lift, then a deliberate nod. The silver locks beside the jaw follow the chin and settle.","head-shake":"Nova turns left, then right and back to center. The longer locks follow each change of direction."};

for (const [label, ids] of Object.entries(groups)) {
  const group = document.createElement("optgroup");
  group.label = label;
  for (const id of ids) group.append(new Option(spec.clips.find(c => c.id === id).label, id));
  $("clip").append(group);
}
$("clip").value = "listening";
for (const size of spec.displaySizesPx) $("size").add(new Option(size+" px",size));
$("size").add(new Option("512 px · source",512));
$("size").value = String(spec.defaultDisplayPx);
function resize(){canvas.style.width = $("size").value+"px";}
resize(); $("size").onchange = resize;
$("background").onchange = () => $("stage").classList.toggle("light",$("background").value==="Light");

function paint(i, eye) {
  index=i; lastEye=eye;
  ctx.clearRect(0,0,512,512); ctx.drawImage(frames[i],0,0);
  if (eye>0 && eye<layer.frameCount-1 && eyeFrames.length) {
    const {x,y,width,height}=layer.rect;
    ctx.clearRect(x,y,width,height); ctx.drawImage(eyeFrames[eye],x,y);
  }
  $("frame").value=i; $("count").value=(i+1)+" / "+clip.frameCount;
}
function requestTick() {
  if (!timer && !document.hidden && (playing || blinkStart!==null)) timer=requestAnimationFrame(tick);
}
function tick(now) {
  timer=0;
  if (!frames.length) return;
  let i=index;
  if (playing) {
    const age=Math.max(0,Math.floor((now-start)*clip.fps/1000));
    if (clip.playback==="once" && age>=clip.frameCount) {
      i=clip.frameCount-1;playing=false;$("play").textContent="Play";
    } else i=age%clip.frameCount;
  }
  if (playing && now>=nextBlink && blinkStart===null) startBlink(now);
  let eye=blinkStart===null?-1:Math.max(0,Math.floor((now-blinkStart)*layer.fps/1000));
  if (eye>=layer.frameCount) {blinkStart=null;eye=-1;}
  if (i!==index || eye!==lastEye) paint(i,eye);
  requestTick();
}
function startBlink(now) {
  if (!eyeFrames.length) return;
  blinkStart=now;
  nextBlink=playing && clip.id==="speaking" && !reduced.matches ? now+3400+Math.random()*2100 : Infinity;
}
function stop() {
  cancelAnimationFrame(timer); timer=0; playing=false;blinkStart=null;nextBlink=Infinity;
  $("play").textContent="Play";
  if (frames.length && lastEye!==-1) paint(index,-1);
}
function play() {
  if (!frames.length || clip.playback==="level") return;
  if (clip.playback==="once" && index===clip.frameCount-1) paint(0,-1);
  const now=performance.now();
  start=now-index*1000/clip.fps;playing=true;$("play").textContent="Pause";
  nextBlink=clip.id==="speaking" && !reduced.matches ? now+760 : Infinity;
  requestTick();
}
function readImgs(files) {
  return Promise.all(files.map(file=>new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Extract the full folder before opening the preview. Could not load "+file));
    img.src=file;
  })));
}
async function load(){
  const stamp=++loadNumber;stop();frames=[];eyeFrames=[];lastEye=-1;
  clip=spec.clips.find(c=>c.id===$("clip").value);
  $("action").textContent=notes[clip.id];
  const isLevel=clip.playback==="level", hasEyes=layer.appliesTo.includes(clip.id);
  $("play").disabled=true;$("blink").hidden=!hasEyes;$("blink").disabled=true;
  $("frame").disabled=true;$("error").hidden=true;
  $("rangeName").textContent=isLevel?"Mouth opening":"Frame";$("frame").max=clip.frameCount-1;
  try {
    const [base, eyes]=await Promise.all([readImgs(clip.files),hasEyes?readImgs(layer.files):Promise.resolve([])]);
    if (stamp!==loadNumber)return;
    frames=base;eyeFrames=eyes;paint(0,-1);
    $("frame").disabled=false;$("play").disabled=isLevel;$("blink").disabled=!hasEyes;
    if(!isLevel && !reduced.matches && !document.hidden)play();
  } catch(e) {
    if(stamp===loadNumber){$("error").textContent=e.message;$("error").hidden=false;}
  }
}
$("clip").onchange=load;
$("play").onclick=()=>playing?stop():play();
$("blink").onclick=()=>{if(eyeFrames.length){startBlink(performance.now());requestTick();}};
$("frame").oninput=()=>{
  if(!frames.length)return;
  if(clip.playback!=="level")stop();
  paint(Number($("frame").value),lastEye);
};
document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();});
reduced.addEventListener("change",()=>{if(reduced.matches)stop();});
load();
